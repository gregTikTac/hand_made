<!doctype html>
<html lang="ru">
<body style="font-family: sans-serif; color: #2a2118; line-height: 1.5;">
  <p>Здравствуйте!</p>
  <p>Файл по заказу <strong>{{ order.number }}</strong> готов. Ссылки действуют {{ days }} дней, каждый файл можно скачать {{ downloads }} раз.</p>
  <ul>
    {% for link in links %}
    <li><a href="{{ link.url }}">{{ link.label }}</a></li>
    {% endfor %}
  </ul>
  <p>— {{ site_name }}</p>
</body>
</html>
